<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eli M. Nails - Agenda de Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- P2: Supabase SDK (UMD explicito, version pineada) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // A1b · Blush Atelier
                        'paper':    '#FAF6F3',
                        'surface':  '#FFFFFF',
                        'ink':      '#3B2F35',
                        'ink-soft': '#776569',
                        'line':     '#EADFDB',
                        'blush':    '#E9D3DC',
                        'blush-2':  '#F4E7EC',
                        'gold':     '#BE9E6F',
                        'gold-ink': '#8C6B3A',
                        'st-pending':   '#8E5B73',
                        'st-confirmed': '#6E8F6E',
                        'st-done':      '#7C5C88',
                        'st-cancelled': '#A8575F',
                        // compatibilidad con los nombres anteriores
                        'eli-pink':  '#F4E7EC',
                        'eli-lilac': '#E9D3DC',
                        'eli-gold':  '#BE9E6F',
                        'eli-green': '#E3EDE3',
                        'eli-gray':  '#EDE7E6',
                        'eli-dark':  '#3B2F35',
                    },
                    fontFamily: {
                        'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        'sans': ['Inter', 'ui-sans-serif', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap');

        /* ── A1b · Blush Atelier ── */
        :root {
            --paper: #FAF6F3;
            --surface: #FFFFFF;
            --blush: #E9D3DC;
            --blush-2: #F4E7EC;
            --ink: #3B2F35;
            --ink-soft: #776569;
            --line: #EADFDB;
            --gold: #BE9E6F;
            --gold-ink: #8C6B3A;
            --pending: #8E5B73;
            --confirmed: #6E8F6E;
            --done: #7C5C88;
            --cancelled: #A8575F;
            --shadow-row: 0 1px 1px rgba(59, 47, 53, .03), 0 6px 18px rgba(59, 47, 53, .045);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .display {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        /* ── marca ── */
        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            font-size: 30px;
            line-height: 1.1;
            letter-spacing: .01em;
            color: var(--ink);
            margin: 0;
        }
        .brand-star { color: var(--gold); font-size: 18px; }
        .brand-sub { color: var(--ink-soft); font-size: 13px; margin: 6px 0 0; }

        /* ── tabs ── */
        .nav-tab {
            color: var(--ink-soft);
            background: transparent;
            min-height: 48px;
            transition: color .16s ease, box-shadow .16s ease;
        }
        .nav-tab:hover { color: var(--ink); }
        .nav-tab.active {
            color: var(--ink);
            background: transparent;
            font-weight: 500;
            box-shadow: inset 0 -2px 0 var(--gold);
        }

        /* ── botones ── */
        .btn-primary {
            background-color: var(--blush);
            color: var(--ink);
            min-height: 44px;
            transition: background-color .16s ease;
        }
        .btn-primary:hover { background-color: #DFC2CE; }

        .btn-secondary {
            background-color: var(--blush-2);
            color: var(--ink);
            transition: background-color .16s ease;
        }
        .btn-secondary:hover { background-color: #EEDCE4; }

        .btn-danger {
            background-color: #F7E7E7;
            color: #7A2E36;
            transition: background-color .16s ease;
        }
        .btn-danger:hover { background-color: #F1D6D6; }

        /* ── inputs ── */
        .input-field { min-height: 44px; }
        .input-field:focus {
            border-color: var(--gold-ink);
            box-shadow: 0 0 0 3px rgba(140, 107, 58, .18);
        }
        :focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        /* ── filas del listado ── */
        .appt-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 3px solid transparent;
            border-radius: 14px;
            padding: 14px 18px;
            box-shadow: var(--shadow-row);
            cursor: pointer;
            transition: box-shadow .16s ease, transform .16s ease;
        }
        .appt-row:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(59, 47, 53, .07);
        }
        .appt-row.appointment-pending   { border-left-color: var(--pending); }
        .appt-row.appointment-confirmed { border-left-color: var(--confirmed); }
        .appt-row.appointment-completed { border-left-color: var(--done); }
        .appt-row.appointment-cancelled { border-left-color: var(--cancelled); }

        .appt-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            font-size: 19px;
            line-height: 1.2;
        }
        .appt-meta { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
        .appt-when { text-align: right; }
        .appt-date { color: var(--ink-soft); font-size: 11.5px; }
        .appt-time { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .appt-price {
            font-size: 15px;
            font-weight: 500;
            color: var(--gold-ink);
            font-variant-numeric: tabular-nums;
            text-align: right;
            min-width: 84px;
        }

        /* ── badge de estado ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 600;
            background: var(--blush-2);
            color: #5C3A4A;
            padding: 6px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .badge .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pending);
            display: inline-block;
        }
        .badge.confirmed { background: #E9F0E9; color: #3F5A3F; }
        .badge.confirmed .badge-dot { background: var(--confirmed); }
        .badge.completed { background: #F0EAF3; color: #553D60; }
        .badge.completed .badge-dot { background: var(--done); }
        .badge.cancelled { background: #F6E9EA; color: #6B353B; }
        .badge.cancelled .badge-dot { background: var(--cancelled); }

        /* ── calendario ── */
        .fc { font-family: 'Inter', sans-serif; }
        .fc .fc-toolbar-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--ink);
        }
        .fc .fc-button {
            background: var(--surface) !important;
            border: 1px solid var(--line) !important;
            color: var(--ink) !important;
            border-radius: 8px !important;
            box-shadow: none !important;
            font-size: 12.5px;
            font-weight: 500;
            padding: .45rem .7rem;
            text-transform: none;
            min-height: 36px;
        }
        .fc .fc-button:hover { background: var(--blush-2) !important; }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background: var(--blush) !important;
            border-color: var(--blush) !important;
            color: var(--ink) !important;
        }
        .fc .fc-button:disabled { opacity: .45; }
        .fc-theme-standard td, .fc-theme-standard th { border-color: var(--line); }
        .fc-theme-standard .fc-scrollgrid { border-color: var(--line); }
        .fc .fc-col-header-cell-cushion {
            color: var(--ink-soft);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .1em;
            font-weight: 500;
        }
        .fc .fc-daygrid-day-number { color: var(--ink-soft); font-size: 12px; }
        .fc .fc-day-today { background: #FBF1F4 !important; }
        .fc .fc-day-today .fc-daygrid-day-number { color: var(--pending); font-weight: 600; }
        .fc .fc-event {
            border: 0 !important;
            border-left: 3px solid var(--pending) !important;
            border-radius: 6px;
            padding: 2px 5px;
            font-size: 11px;
        }
        .fc-event-pending   { background-color: #FBECF1 !important; border-left-color: var(--pending) !important; color: #5C3A4A; }
        .fc-event-confirmed { background-color: #EAF3EA !important; border-left-color: var(--confirmed) !important; color: #3F5A3F; }
        .fc-event-completed { background-color: #F1EAF4 !important; border-left-color: var(--done) !important; color: #553D60; }
        .fc-event-cancelled { background-color: #F4E9EA !important; border-left-color: var(--cancelled) !important; color: #6B353B; }
        .fc-button-group { border-radius: 8px; overflow: hidden; }

        /* ── modales ── */
        .modal-overlay {
            background-color: rgba(59, 47, 53, .55);
            backdrop-filter: blur(2px);
        }
        .modal-content { animation: slide-up .28s ease-out; }

        /* ── varios ── */
        .whatsapp-btn { background-color: #25D366; min-height: 44px; transition: background-color .16s ease; }
        .whatsapp-btn:hover { background-color: #1FA855; }
        .export-btn { background-color: var(--blush-2); color: var(--ink); min-height: 44px; transition: background-color .16s ease; }
        .export-btn:hover { background-color: #EEDCE4; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 767px) {
            .appt-row {
                grid-template-columns: 1fr auto;
                grid-template-areas:
                    "who  badge"
                    "when price";
                gap: 10px 12px;
                padding: 13px 14px;
            }
            .appt-who { grid-area: who; }
            .appt-when { grid-area: when; text-align: left; display: flex; gap: 8px; align-items: baseline; }
            .appt-price { grid-area: price; }
            .badge { grid-area: badge; justify-self: end; }
            .appt-name { font-size: 18px; }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Aviso de estado (errores de red / sincronizacion) -->
        <div id="app-banner" class="hidden mb-4 rounded-lg px-4 py-3 text-sm" role="alert"></div>

        <!-- Header -->
        <header class="mb-6">
            <h1 class="brand"><span class="brand-star" aria-hidden="true">✦</span> Eli M. Nails</h1>
            <p class="brand-sub">Agenda de turnos personal</p>
        </header>
        
        <!-- Navigation Tabs -->
        <div class="flex mb-6 border-b border-line">
            <button id="calendar-tab" class="nav-tab active flex-1 py-3 px-4 text-center">
                <i class="fas fa-calendar-alt mr-2"></i> Calendario
            </button>
            <button id="appointments-tab" class="nav-tab flex-1 py-3 px-4 text-center">
                <i class="fas fa-list mr-2"></i> Listado
            </button>
            <button id="new-tab" class="nav-tab flex-1 py-3 px-4 text-center">
                <i class="fas fa-plus-circle mr-2"></i> Nuevo Turno
            </button>
        </div>
        
        <!-- Calendar View -->
        <div id="calendar-view" class="view-section bg-white rounded-xl shadow-md p-4 mb-6">
            <div id="calendar" class="animate-fade-in"></div>
        </div>
        
        <!-- Appointments List View -->
        <div id="appointments-view" class="view-section hidden bg-white rounded-xl shadow-md p-4 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                <div class="w-full md:w-auto mb-4 md:mb-0">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Buscar por nombre o servicio..." 
                               class="w-full md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <select id="status-filter" class="flex-1 md:flex-none min-w-0 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                        <option value="all">Todos los estados</option>
                        <option value="pending">Pendiente</option>
                        <option value="confirmed">Confirmado</option>
                        <option value="completed">Realizado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                    <input type="date" id="date-filter" class="flex-1 md:flex-none min-w-0 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                    <button id="export-excel" class="export-btn w-full md:w-auto px-4 py-2.5 rounded-lg text-eli-dark font-medium">
                        <i class="fas fa-file-excel mr-2"></i> Exportar
                    </button>
                    <button type="button" id="backup-btn" class="bg-gray-200 w-full md:w-auto px-4 py-2.5 rounded-lg font-medium">
                        <i class="fas fa-download mr-2"></i> Respaldar
                    </button>
                    <button type="button" id="restore-btn" class="bg-gray-200 w-full md:w-auto px-4 py-2.5 rounded-lg font-medium">
                        <i class="fas fa-upload mr-2"></i> Restaurar
                    </button>
                    <input type="file" id="restore-input" accept="application/json,.json" class="hidden">
                    <button type="button" id="migrate-btn" class="hidden bg-eli-gold w-full md:w-auto px-4 py-2.5 rounded-lg font-medium">
                        <i class="fas fa-cloud-upload-alt mr-2"></i> Migrar turnos locales
                    </button>
                </div>
            </div>
            <p id="data-status" class="mt-3 text-sm" role="status" aria-live="polite" hidden></p>
            
            <div id="appointments-list" class="space-y-3">
                <!-- Appointments will be loaded here -->
            </div>
        </div>
        
        <!-- New Appointment Form View -->
        <div id="new-appointment-view" class="view-section hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold text-eli-dark mb-6">Nuevo Turno</h2>
            
            <form id="appointment-form" class="space-y-4">
                <input type="hidden" id="appointment-id">
                
                <div>
                    <label for="client-name" class="block text-sm font-medium text-gray-700 mb-1">Nombre completo <span class="text-eli-dark font-bold" aria-hidden="true">*</span></label>
                    <input type="text" id="client-name" required autocomplete="name"
                           class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                </div>
                
                <div>
                    <label for="service-type" class="block text-sm font-medium text-gray-700 mb-1">Servicio <span class="text-eli-dark font-bold" aria-hidden="true">*</span></label>
                    <select id="service-type" required
                            class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                        <option value="">Seleccionar servicio</option>
                        <option value="Kapping">Kapping</option>
                        <option value="Soft gel">Soft gel</option>
                        <option value="Semipermanente">Semipermanente</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="appointment-date" class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-eli-dark font-bold" aria-hidden="true">*</span></label>
                        <input type="date" id="appointment-date" required
                               class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="appointment-time" class="block text-sm font-medium text-gray-700 mb-1">Hora <span class="text-eli-dark font-bold" aria-hidden="true">*</span></label>
                        <select id="appointment-time" required
                                class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                            <option value="">Seleccionar hora</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                            <option value="19:00">19:00</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label for="appointment-price" class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
                    <input type="number" id="appointment-price" min="0" step="100" inputmode="decimal"
                           class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                </div>
                
                <div>
                    <label for="appointment-notes" class="block text-sm font-medium text-gray-700 mb-1">Notas adicionales</label>
                    <textarea id="appointment-notes" rows="3"
                              class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent"></textarea>
                </div>
                
                <div>
                    <label for="appointment-status" class="block text-sm font-medium text-gray-700 mb-1">Estado <span class="text-eli-dark font-bold" aria-hidden="true">*</span></label>
                    <select id="appointment-status" required
                            class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                        <option value="pending">Pendiente</option>
                        <option value="confirmed">Confirmado</option>
                        <option value="completed">Realizado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                </div>
                
                <div class="flex flex-wrap gap-3 pt-4">
                    <button type="submit" id="save-btn" class="btn-primary px-6 py-2 rounded-lg font-medium">
                        <i class="fas fa-save mr-2"></i> Guardar
                    </button>
                    <button type="button" id="update-btn" class="btn-primary px-6 py-2 rounded-lg font-medium hidden">
                        <i class="fas fa-edit mr-2"></i> Modificar
                    </button>
                    <button type="button" id="delete-btn" class="btn-danger px-6 py-2 rounded-lg font-medium hidden">
                        <i class="fas fa-trash-alt mr-2"></i> Eliminar
                    </button>
                    <button type="button" id="whatsapp-btn" class="whatsapp-btn px-6 py-2 rounded-lg text-[#0B3D1E] font-medium hidden">
                        <i class="fab fa-whatsapp mr-2"></i> WhatsApp
                    </button>
                    <button type="button" id="clear-btn" class="bg-gray-200 px-6 py-2 rounded-lg font-medium">
                        <i class="fas fa-times mr-2"></i> Limpiar
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Footer -->
        <footer class="mt-12 text-center text-sm text-gray-600">
            <p>Creado con <i class="fas fa-heart text-red-400"></i> por @Jacinto.Cards</p>
            <button type="button" id="logout-btn" class="mt-2 text-xs text-gray-400 hover:text-gray-600 underline">Cerrar sesión</button>
        </footer>
    </div>
    
    <!-- P2: pantalla de login -->
    <div id="auth-screen" class="fixed inset-0 z-[60] hidden flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-8 text-center">
            <i class="fas fa-hand-holding-heart text-4xl text-eli-lilac mb-4"></i>
            <h1 class="text-2xl font-bold text-eli-dark mb-1">Eli M. Nails</h1>
            <p class="text-sm text-gray-600 mb-6">Agenda de turnos</p>
            <form id="email-auth-form" class="text-left space-y-3">
                <div>
                    <label for="auth-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="auth-email" name="email" required autocomplete="email"
                           class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                </div>
                <div>
                    <label for="auth-password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="auth-password" name="password" required minlength="6"
                           autocomplete="current-password"
                           class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-eli-lilac focus:border-transparent">
                </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize database
            let db;
            const DB_NAME = 'eli_nails_appointments';
            const DB_VERSION = 1;
            const STORE_NAME = 'appointments';
            
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            
            request.onupgradeneeded = function(event) {
                db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    store.createIndex('date', 'date', { unique: false });
                    store.createIndex('status', 'status', { unique: false });
                }
            };
            
            // P2: la app ya no arranca al abrir IndexedDB. Solo se resuelve `dbReady`.
            // IndexedDB se conserva para el respaldo local y la migración.
            const dbReady = new Promise(function(resolve) {
                request.onsuccess = function(event) {
                    db = event.target.result;
                    resolve(db);
                };
                request.onerror = function(event) {
                    console.error('Database error:', event.target.error);
                    resolve(null);
                };
            });
            
            // DOM Elements
            const calendarView = document.getElementById('calendar-view');
            const appointmentsView = document.getElementById('appointments-view');
            const newAppointmentView = document.getElementById('new-appointment-view');
            
            const calendarTab = document.getElementById('calendar-tab');
            const appointmentsTab = document.getElementById('appointments-tab');
            const newTab = document.getElementById('new-tab');
            
            const appointmentForm = document.getElementById('appointment-form');
            const clientNameInput = document.getElementById('client-name');
            const serviceTypeInput = document.getElementById('service-type');
            const appointmentDateInput = document.getElementById('appointment-date');
            const appointmentTimeInput = document.getElementById('appointment-time');
            const appointmentPriceInput = document.getElementById('appointment-price');
            const appointmentNotesInput = document.getElementById('appointment-notes');
            const appointmentStatusInput = document.getElementById('appointment-status');
            const appointmentIdInput = document.getElementById('appointment-id');
            
            const saveBtn = document.getElementById('save-btn');
            const updateBtn = document.getElementById('update-btn');
            const deleteBtn = document.getElementById('delete-btn');
            const whatsappBtn = document.getElementById('whatsapp-btn');
            const clearBtn = document.getElementById('clear-btn');
            
            const searchInput = document.getElementById('search-input');
            const statusFilter = document.getElementById('status-filter');
            const dateFilter = document.getElementById('date-filter');
            const exportExcelBtn = document.getElementById('export-excel');
            
            const appointmentsList = document.getElementById('appointments-list');
            
            const appointmentModal = document.getElementById('appointment-modal');
            const confirmModal = document.getElementById('confirm-modal');
            
            // Tab Navigation
            calendarTab.addEventListener('click', () => showView('calendar'));
            appointmentsTab.addEventListener('click', () => showView('appointments'));
            newTab.addEventListener('click', () => showView('new'));
            
            function showView(view) {
                // Update active tab
                document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
                
                // Hide all views
                document.querySelectorAll('.view-section').forEach(section => section.classList.add('hidden'));
                
                // Show selected view
                if (view === 'calendar') {
                    calendarTab.classList.add('active');
                    calendarView.classList.remove('hidden');
                    if (calendar) calendar.render();
                } else if (view === 'appointments') {
                    appointmentsTab.classList.add('active');
                    appointmentsView.classList.remove('hidden');
                    loadAppointmentsList();
                } else if (view === 'new') {
                    newTab.classList.add('active');
                    newAppointmentView.classList.remove('hidden');
                    resetForm();
                }
            }
            
            // Form Handling
            appointmentForm.addEventListener('submit', function(e) {
                e.preventDefault();
                saveAppointment();
            });
            
            clearBtn.addEventListener('click', resetForm);
            
            function resetForm() {
                appointmentForm.reset();
                appointmentIdInput.value = '';
                saveBtn.classList.remove('hidden');
                updateBtn.classList.add('hidden');
                deleteBtn.classList.add('hidden');
                whatsappBtn.classList.add('hidden');
                
                // Set default date to today (local Buenos Aires time, not UTC)
                appointmentDateInput.value = todayISO();
                
                // Set default status to pending
                appointmentStatusInput.value = 'pending';
            }
            
            async function saveAppointment() {
                const appointment = {
                    clientName: clientNameInput.value.trim(),
                    serviceType: serviceTypeInput.value,
                    date: appointmentDateInput.value,
                    time: appointmentTimeInput.value,
                    price: appointmentPriceInput.value ? parseInt(appointmentPriceInput.value) : 0,
                    notes: appointmentNotesInput.value.trim(),
                    status: appointmentStatusInput.value
                };
                
                if (!appointment.clientName || !appointment.serviceType || !appointment.date || !appointment.time) {
                    alert('Por favor complete todos los campos obligatorios');
                    return;
                }
                
                const editando = appointmentIdInput.value;
                try {
                    if (editando) {
                        const { error } = await supabase.from('turnos')
                            .update(toDb(appointment))
                            .eq('id', editando);
                        if (error) throw error;
                    } else {
                        const { error } = await supabase.from('turnos').insert(toDb(appointment));
                        if (error) throw error;
                    }
                    await loadAppointments();
                    resetForm();
                    showView('appointments');
                } catch (error) {
                    console.error('Error guardando el turno:', error);
                    mostrarBanner('No se pudo guardar el turno: ' + (error.message || 'error de conexión'), 'error');
                }
            }
            
            // P2: lectura desde Supabase (tabla `turnos`) + cache en memoria.
            let cache = [];

            async function fetchTurnos() {
                const { data, error } = await supabase.from('turnos')
                    .select('*')
                    .order(COLS.date, { ascending: true })
                    .order(COLS.time, { ascending: true });
                if (error) throw error;
                return (data || []).map(fromDb);
            }

            async function loadAppointments() {
                try {
                    cache = await fetchTurnos();
                    if (calendar) {
                        calendar.removeAllEvents();
                        cache.forEach(function(appointment) {
                            calendar.addEvent({
                                id: appointment.id,
                                title: appointment.clientName + ' - ' + appointment.serviceType,
                                start: appointment.date + 'T' + appointment.time + ':00',
                                extendedProps: {
                                    clientName: appointment.clientName,
                                    serviceType: appointment.serviceType,
                                    price: appointment.price,
                                    notes: appointment.notes,
                                    status: appointment.status
                                },
                                className: 'fc-event-' + appointment.status
                            });
                        });
                    }
                    if (!appointmentsView.classList.contains('hidden')) {
                        loadAppointmentsList();
                    }
                } catch (error) {
                    console.error('Error cargando turnos:', error);
                    mostrarBanner('No se pudieron cargar los turnos. Revisá la conexión.');
                }
            }
            
            // P2: filtra el cache (no consulta la base en cada tecla)
            function loadAppointmentsList(filter = {}) {
                let appointments = cache.slice();
                
                if (filter.search) {
                    const searchTerm = filter.search.toLowerCase();
                    appointments = appointments.filter(app =>
                        String(app.clientName || '').toLowerCase().includes(searchTerm) ||
                        String(app.serviceType || '').toLowerCase().includes(searchTerm)
                    );
                }
                
                if (filter.status && filter.status !== 'all') {
                    appointments = appointments.filter(app => app.status === filter.status);
                }
                
                if (filter.date) {
                    appointments = appointments.filter(app => app.date === filter.date);
                }
                
                appointments.sort(function(a, b) {
                    const dateA = new Date(a.date + 'T' + a.time + ':00');
                    const dateB = new Date(b.date + 'T' + b.time + ':00');
                    return dateA - dateB;
                });
                
                renderAppointmentsList(appointments, filter);
            }
            
            // Render appointments list
            function renderAppointmentsList(appointments, filter = {}) {
                appointmentsList.innerHTML = '';
                
                const hasFilter = !!(filter.search || (filter.status && filter.status !== 'all') || filter.date);
                
                if (appointments.length === 0) {
                    const box = document.createElement('div');
                    box.className = 'text-center py-10 text-ink-soft';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-calendar-times text-3xl mb-3 block';
                    const msg = document.createElement('p');
                    msg.className = 'text-sm';
                    msg.textContent = hasFilter
                        ? 'No hay turnos que coincidan con el filtro'
                        : 'No hay turnos programados';
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn-primary mt-4 px-5 py-2.5 rounded-lg font-medium text-sm';
                    btn.textContent = 'Nuevo turno';
                    btn.addEventListener('click', () => showView('new'));
                    box.appendChild(icon);
                    box.appendChild(msg);
                    box.appendChild(btn);
                    appointmentsList.appendChild(box);
                    return;
                }
                
                appointments.forEach(function(appointment) {
                    const row = document.createElement('div');
                    row.className = 'appt-row ' + getStatusClass(appointment.status);
                    row.tabIndex = 0;
                    row.setAttribute('role', 'button');
                    row.setAttribute('aria-label', 'Turno de ' + appointment.clientName);
                    
                    const who = document.createElement('div');
                    who.className = 'appt-who';
                    const name = document.createElement('div');
                    name.className = 'appt-name';
                    name.textContent = appointment.clientName;
                    const meta = document.createElement('div');
                    meta.className = 'appt-meta';
                    meta.textContent = appointment.serviceType;
                    who.appendChild(name);
                    who.appendChild(meta);
                    
                    const when = document.createElement('div');
                    when.className = 'appt-when';
                    const day = document.createElement('div');
                    day.className = 'appt-date';
                    day.textContent = shortDate(appointment.date);
                    const hour = document.createElement('div');
                    hour.className = 'appt-time';
                    hour.textContent = appointment.time;
                    when.appendChild(day);
                    when.appendChild(hour);
                    
                    const price = document.createElement('div');
                    price.className = 'appt-price';
                    price.textContent = appointment.price ? formatMoney(appointment.price) : '—';
                    
                    const badge = document.createElement('span');
                    badge.className = 'badge ' + appointment.status;
                    const dot = document.createElement('i');
                    dot.className = 'badge-dot';
                    const badgeText = document.createElement('span');
                    badgeText.textContent = getStatusText(appointment.status);
                    badge.appendChild(dot);
                    badge.appendChild(badgeText);
                    
                    row.appendChild(who);
                    row.appendChild(when);
                    row.appendChild(price);
                    row.appendChild(badge);
                    
                    row.addEventListener('click', () => showAppointmentDetails(appointment));
                    row.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            showAppointmentDetails(appointment);
                        }
                    });
                    appointmentsList.appendChild(row);
                });
            }
            
            // Filter appointments
            searchInput.addEventListener('input', function() {
                loadAppointmentsList({
                    search: this.value,
                    status: statusFilter.value,
                    date: dateFilter.value
                });
            });
            
            statusFilter.addEventListener('change', function() {
                loadAppointmentsList({
                    search: searchInput.value,
                    status: this.value,
                    date: dateFilter.value
                });
            });
            
            dateFilter.addEventListener('change', function() {
                loadAppointmentsList({
                    search: searchInput.value,
                    status: statusFilter.value,
                    date: this.value
                });
            });
            
            // Export to Excel (P2: desde el cache, ya no desde IndexedDB)
            exportExcelBtn.addEventListener('click', function() {
                try {
                    const appointments = cache.slice();
                    
                    // Prepare data for Excel
                    const excelData = appointments.map(app => ({
                        'Nombre': app.clientName,
                        'Servicio': app.serviceType,
                        'Fecha': formatDate(app.date),
                        'Hora': app.time,
                        'Precio': '$' + (app.price || ''),
                        'Notas': app.notes || '',
                        'Estado': getStatusText(app.status)
                    }));
                    
                    // Create worksheet
                    const ws = XLSX.utils.json_to_sheet(excelData);
                    
                    // Create workbook
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Turnos');
                    
                    // Export to file
                    XLSX.writeFile(wb, 'Turnos_Eli_Nails_' + todayISO() + '.xlsx');
                } catch (error) {
                    console.error('Error exportando:', error);
                    mostrarBanner('No se pudo exportar el Excel.', 'error');
                }
            });
            
            // ─────────────────────────────────────────────────────────────
            // P1: Respaldo y restauración (JSON)
            // ─────────────────────────────────────────────────────────────
            const BACKUP_APP = 'eli-nails';
            const BACKUP_SCHEMA = 1;
            const BACKUP_MAX_BYTES = 5 * 1024 * 1024;   // 5 MB
            const BACKUP_MAX_ROWS = 5000;
            const PRE_RESTORE_KEY = 'eli_backup_prerestore';
            const ESTADOS_VALIDOS = ['pending', 'confirmed', 'completed', 'cancelled'];

            const backupBtn = document.getElementById('backup-btn');
            const restoreBtn = document.getElementById('restore-btn');
            const restoreInput = document.getElementById('restore-input');
            const dataStatus = document.getElementById('data-status');

            // Aviso accesible (aria-live). Solo textContent: nunca innerHTML.
            let dataStatusTimer = null;
            function setDataStatus(kind, text) {
                dataStatus.textContent = text;
                dataStatus.className = 'mt-3 text-sm ' + (kind === 'error' ? 'text-red-600' : 'text-green-700');
                dataStatus.hidden = false;
                clearTimeout(dataStatusTimer);
                dataStatusTimer = setTimeout(function () {
                    dataStatus.hidden = true;
                    dataStatus.textContent = '';
                }, 7000);
            }

            function leerTodosLosTurnos() {
                return new Promise(function (resolve, reject) {
                    try {
                        const transaction = db.transaction([STORE_NAME], 'readonly');
                        const request = transaction.objectStore(STORE_NAME).getAll();
                        request.onsuccess = function () { resolve(request.result || []); };
                        request.onerror = function () { reject(request.error); };
                    } catch (error) { reject(error); }
                });
            }

            function construirRespaldo(rows) {
                return {
                    app: BACKUP_APP,
                    schema: BACKUP_SCHEMA,
                    exportedAt: new Date().toISOString(),
                    zona: TZ,
                    count: rows.length,
                    appointments: rows
                };
            }

            function descargarJson(payload, filename) {
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                link.rel = 'noopener';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
            }

            async function respaldar(sufijo) {
                // P2: respalda la agenda de la nube (cache), no IndexedDB
                const rows = cache.slice();
                descargarJson(construirRespaldo(rows), 'Eli_Backup_' + todayISO() + (sufijo || '') + '.json');
                return rows.length;
            }

            // Devuelve { ok:true, rows } o { ok:false, error }
            function validarRespaldo(texto) {
                let data;
                try {
                    data = JSON.parse(texto);
                } catch (error) {
                    return { ok: false, error: 'El archivo no es un JSON válido.' };
                }

                let rows;
                if (Array.isArray(data)) rows = data;
                else if (data && Array.isArray(data.appointments)) rows = data.appointments;
                else return { ok: false, error: 'El archivo no contiene una lista de turnos ("appointments").' };

                if (rows.length > BACKUP_MAX_ROWS) {
                    return { ok: false, error: 'El archivo tiene ' + rows.length + ' turnos; el máximo es ' + BACKUP_MAX_ROWS + '.' };
                }

                const limpios = [];
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i];
                    const n = i + 1;
                    if (!r || typeof r !== 'object' || Array.isArray(r)) {
                        return { ok: false, error: 'Registro ' + n + ': no es un objeto válido.' };
                    }

                    const clientName = typeof r.clientName === 'string' ? r.clientName.trim() : '';
                    if (!clientName) return { ok: false, error: 'Registro ' + n + ': falta el nombre de la clienta.' };
                    if (clientName.length > 120) return { ok: false, error: 'Registro ' + n + ': el nombre supera los 120 caracteres.' };
                    if (/[<>]/.test(clientName)) return { ok: false, error: 'Registro ' + n + ': el nombre contiene caracteres no permitidos (< o >).' };

                    const serviceType = typeof r.serviceType === 'string' ? r.serviceType.trim() : '';
                    if (!serviceType) return { ok: false, error: 'Registro ' + n + ': falta el servicio.' };
                    if (serviceType.length > 60) return { ok: false, error: 'Registro ' + n + ': el servicio supera los 60 caracteres.' };
                    if (/[<>]/.test(serviceType)) return { ok: false, error: 'Registro ' + n + ': el servicio contiene caracteres no permitidos (< o >).' };

                    const date = typeof r.date === 'string' ? r.date.trim() : '';
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !parseLocalDate(date)) {
                        return { ok: false, error: 'Registro ' + n + ': la fecha "' + date + '" no es válida (formato AAAA-MM-DD).' };
                    }
                    const anio = Number(date.slice(0, 4));
                    if (anio < 2000 || anio > 2100) return { ok: false, error: 'Registro ' + n + ': el año ' + anio + ' está fuera de rango.' };

                    const time = typeof r.time === 'string' ? r.time.trim() : '';
                    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) {
                        return { ok: false, error: 'Registro ' + n + ': la hora "' + time + '" no es válida (formato HH:MM).' };
                    }

                    const priceNum = Number(r.price);
                    if (!Number.isFinite(priceNum) || priceNum < 0 || priceNum > 10000000) {
                        return { ok: false, error: 'Registro ' + n + ': el precio no es un número válido.' };
                    }

                    const notes = typeof r.notes === 'string' ? r.notes.trim() : '';
                    if (notes.length > 2000) return { ok: false, error: 'Registro ' + n + ': las notas superan los 2000 caracteres.' };
                    if (/[<>]/.test(notes)) return { ok: false, error: 'Registro ' + n + ': las notas contienen caracteres no permitidos (< o >).' };

                    const status = (r.status === undefined || r.status === null || r.status === '') ? 'pending' : String(r.status);
                    if (ESTADOS_VALIDOS.indexOf(status) === -1) {
                        return { ok: false, error: 'Registro ' + n + ': estado "' + status + '" desconocido.' };
                    }

                    limpios.push({
                        clientName: clientName,
                        serviceType: serviceType,
                        date: date,
                        time: time,
                        price: Math.round(priceNum),
                        notes: notes,
                        status: status,
                        timestamp: new Date(date + 'T' + time + ':00').getTime()
                    });
                }

                return { ok: true, rows: limpios };
            }

            async function reemplazarTurnos(rows) {
                // P2: reemplaza la agenda en la nube (RLS limita a las filas propias)
                const borrado = await supabase.from('turnos').delete().gte('id', 0);
                if (borrado.error) throw borrado.error;
                if (rows.length) {
                    const insertado = await supabase.from('turnos').insert(rows.map(toDb));
                    if (insertado.error) throw insertado.error;
                }
                return rows.length;
            }

            // Reutiliza el modal de confirmación existente
            function pedirConfirmacion(titulo, mensaje, textoBoton, onConfirm) {
                const actionBtn = document.getElementById('confirm-action-btn');
                document.getElementById('confirm-title').textContent = titulo;
                document.getElementById('confirm-message').textContent = mensaje;
                actionBtn.textContent = textoBoton;
                confirmModal.classList.remove('hidden');
                actionBtn.onclick = async function () {
                    confirmModal.classList.add('hidden');
                    actionBtn.textContent = 'Confirmar';
                    await onConfirm();
                };

                document.getElementById('close-confirm-modal').onclick = function () { confirmModal.classList.add('hidden'); };

            async function restaurarDesdeTexto(texto) {
                const resultado = validarRespaldo(texto);
                if (!resultado.ok) {
                    setDataStatus('error', resultado.error);
                    return;
                }

                // P2: el estado "actual" es el de la nube (cache), no IndexedDB
                const actuales = cache.slice();

                const nuevos = resultado.rows.length;
                const mensaje = nuevos === 0
                    ? 'Vas a dejar la agenda VACÍA: se borran los ' + actuales.length + ' turnos actuales. Antes se descarga un respaldo del estado actual.'
                    : 'Se van a reemplazar los ' + actuales.length + ' turnos actuales por los ' + nuevos + ' del archivo. Antes se descarga un respaldo del estado actual.';

                pedirConfirmacion('Restaurar respaldo', mensaje, 'Restaurar', async function () {
                    // Red de seguridad 1: copia del estado actual en localStorage
                    try {
                        localStorage.setItem(PRE_RESTORE_KEY, JSON.stringify({
                            at: new Date().toISOString(),
                            count: actuales.length,
                            appointments: actuales
                        }));
                    } catch (error) { /* cuota llena: queda el archivo */ }

                    // Red de seguridad 2: archivo descargado
                    try {
                        descargarJson(construirRespaldo(actuales), 'Eli_Backup_' + todayISO() + '_antes_de_restaurar.json');
                    } catch (error) { console.error(error); }

                    await new Promise(function (r) { setTimeout(r, 600); });

                    try {
                        await reemplazarTurnos(resultado.rows);
                        resetForm();
                        await loadAppointments();
                        showView('appointments');
                        setDataStatus('ok', 'Restaurados ' + nuevos + ' turnos. Respaldo previo: Eli_Backup_' + todayISO() + '_antes_de_restaurar.json');
                    } catch (error) {
                        console.error(error);
                        setDataStatus('error', 'No se pudo restaurar el respaldo.');
                    }
                });
            }

            function leerArchivoComoTexto(file) {
                if (file.text) return file.text();
                return new Promise(function (resolve, reject) {
                    const reader = new FileReader();
                    reader.onload = function () { resolve(String(reader.result || '')); };
                    reader.onerror = function () { reject(reader.error); };
                    reader.readAsText(file);
                });
            }

            // ── Mapeo snake_case (Supabase) ↔ camelCase (app) ──

                supabase.auth.onAuthStateChange(function(evento, session) {

                try {

            // ─────────────────────────────────────────────────────────────
            // Login / registro con email y contraseña
            // ─────────────────────────────────────────────────────────────
            const emailAuthForm = document.getElementById('email-auth-form');
            const authEmail = document.getElementById('auth-email');
            const authPassword = document.getElementById('auth-password');
            const emailLoginBtn = document.getElementById('email-login-btn');
            const emailSignupBtn = document.getElementById('email-signup-btn');

            const AUTH_ERR = {
                invalid_credentials: 'Email o contraseña incorrectos.',
                email_not_confirmed: 'Tenés que confirmar tu email antes de iniciar sesión. Revisá tu correo.',
                user_already_exists: 'Ese email ya tiene una cuenta. Probá iniciar sesión.',
                email_exists: 'Ese email ya tiene una cuenta. Probá iniciar sesión.',
                weak_password: 'La contraseña es demasiado débil: usá al menos 6 caracteres.',
                email_address_invalid: 'El email no es válido.',
                over_email_send_rate_limit: 'Demasiados intentos. Esperá unos minutos.',
                over_request_rate_limit: 'Demasiados intentos. Esperá unos minutos.',
                signup_disabled: 'El registro está deshabilitado.',
                registro_restringido: 'No se pudo crear la cuenta: el registro está restringido. Pedí que autoricen este email antes de registrarte.',
                validation_failed: 'Revisá el email y la contraseña.'
            };

            function mensajeAuth(error) {
                if (!error) return 'No se pudo completar la operación.';
                const code = error.code || error.error_code || '';
                if (AUTH_ERR[code]) return AUTH_ERR[code];
                const msg = String(error.message || '');
                if (/invalid login credentials/i.test(msg)) return AUTH_ERR.invalid_credentials;
                if (/email not confirmed/i.test(msg)) return AUTH_ERR.email_not_confirmed;
                if (/already registered|already been registered/i.test(msg)) return AUTH_ERR.user_already_exists;
                // Trigger de allowlist (acceso_permitido): Supabase devuelve un 500 genérico
                if (/database error saving new user|registro no autorizado/i.test(msg)) {
                    return AUTH_ERR.registro_restringido;
                }
                return msg || 'No se pudo completar la operación.';
            }

            // Solo textContent: nunca innerHTML
            function setAuthError(mensaje) {
                authError.textContent = mensaje || '';
                authError.classList.toggle('hidden', !mensaje);
            }

            // Deshabilita todo mientras hay una petición en curso (anti doble clic)
            function authOcupado(ocupado) {
                [emailLoginBtn, emailSignupBtn, googleLoginBtn].forEach(function(b) { b.disabled = ocupado; });
                authEmail.disabled = ocupado;
                authPassword.disabled = ocupado;
                emailAuthForm.setAttribute('aria-busy', ocupado ? 'true' : 'false');
            }

            function validarCredenciales() {
                const email = authEmail.value.trim();
                const pass = authPassword.value;
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                    setAuthError('Ingresá un email válido.');
                    authEmail.focus();
                    return null;
                }
                if (pass.length < 6) {
                    setAuthError('La contraseña debe tener al menos 6 caracteres.');
                    authPassword.focus();
                    return null;
                }
                return { email: email, pass: pass };
            }

            emailAuthForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                if (!emailAuthForm.reportValidity()) return;
                const datos = validarCredenciales();
                if (!datos) return;

                setAuthError('');
                authOcupado(true);
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: datos.email,
                        password: datos.pass
                    });
                    if (error) throw error;
                    if (data && data.session) await iniciarApp(data.session);
                } catch (error) {
                    console.error('Error de login:', error);
                    setAuthError(mensajeAuth(error));
                } finally {
                    authOcupado(false);
                }
            });

            emailSignupBtn.addEventListener('click', async function() {
                if (!emailAuthForm.reportValidity()) return;
                const datos = validarCredenciales();
                if (!datos) return;

                setAuthError('');
                authOcupado(true);
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email: datos.email,
                        password: datos.pass,
                        options: { emailRedirectTo: window.location.origin }
                    });
                    if (error) throw error;

                    // Supabase no revela si el email ya existía: devuelve identities vacío
                    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                        setAuthError(AUTH_ERR.user_already_exists);
                    } else if (data && data.session) {
                        await iniciarApp(data.session);        // Confirm email OFF
                    } else {
                        setAuthError('Cuenta creada. Revisá tu email para confirmarla y después iniciá sesión.');
                    }
                } catch (error) {
                    console.error('Error de registro:', error);
                    setAuthError(mensajeAuth(error));
                } finally {
                    authOcupado(false);
                }
            });

            function sendWhatsApp(appointment) {

                const message = `Hola ${appointment.clientName}! ¿Cómo estás? 

Te confirmo tu turno en Eli M. Nails:
• Servicio: ${appointment.serviceType}
• Día: ${formatDate(appointment.date)}
• Hora: ${appointment.time}

${appointment.notes ? `• Notas: ${appointment.notes}` : ''}

¡Gracias por confiar en mí para cuidar tus uñas! Por favor, recordá asistir sin niños ni acompañantes, así podemos garantizar tranquilidad y puntualidad en tu atención.

            // Helper functions
            // Fechas: siempre en hora local de Buenos Aires.
            // No usar toISOString() ni new Date('YYYY-MM-DD') para fechas sin hora:
            // ambos se interpretan en UTC y en UTC-3 muestran el dia anterior.
            const TZ = 'America/Argentina/Buenos_Aires';

            function todayISO() {
                return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());
            }

            function parseLocalDate(dateString) {
                const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateString ?? ''));
                if (!match) return null;
                const parsed = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
                return isNaN(parsed.getTime()) ? null : parsed;
            }

            function formatDate(dateString) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const date = parseLocalDate(dateString);
                return date ? date.toLocaleDateString('es-AR', options) : '--';
            }

            function shortDate(dateString) {
                const date = parseLocalDate(dateString);
                if (!date) return '--';
                return date.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' })
                    .replace(/\./g, '')
                    .replace(/\u00a0/g, ' ');
            }

            function formatMoney(value) {
                const amount = Number(value) || 0;
                return '$ ' + amount.toLocaleString('es-AR');
            }
            
            function getStatusClass(status) {
                switch(status) {
                    case 'pending': return 'appointment-pending';
                    case 'confirmed': return 'appointment-confirmed';
                    case 'completed': return 'appointment-completed';
                    case 'cancelled': return 'appointment-cancelled';
                    default: return '';
                }
            }
            
            function getStatusBadgeClass(status) {
                switch(status) {
                    case 'pending': return 'bg-eli-pink text-eli-dark';
                    case 'confirmed': return 'bg-eli-green text-eli-dark';
                    case 'completed': return 'bg-eli-lilac text-eli-dark';
                    case 'cancelled': return 'bg-eli-gray text-gray-700';
                    default: return '';
                }
            }
            
            function getStatusText(status) {
                switch(status) {
                    case 'pending': return 'Pendiente';
                    case 'confirmed': return 'Confirmado';
                    case 'completed': return 'Realizado';
                    case 'cancelled': return 'Cancelado';
                    default: return '';
                }
            }
            
            // P2: el arranque depende de la sesión de Supabase.
            iniciarAuth();
            
            // Sin min en los inputs: los turnos pasados son validos (registro de
            // caja) y el filtro debe poder consultar el historial.
