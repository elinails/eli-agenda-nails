name: Backup diario (public + auth + storage)

# Todos los días 23:00 Argentina (UTC-3) = 02:00 UTC.
# Argentina no tiene horario de verano, así que el horario es estable todo el año.
#
# Secrets requeridos:
#   DATABASE_URL          connection string de Supabase (postgres, SSL, puerto 5432)
#   BACKUP_PASSPHRASE     frase para cifrar los dumps (repo público)
# Secrets opcionales (Storage S3):
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_ENDPOINT, S3_BUCKET, S3_REGION
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: pg_dump public + auth
    runs-on: ubuntu-latest
    # El contenedor garantiza pg_dump de la MISMA major que Supabase (17).
    # Si algún día se quita, el paso "Asegurar cliente PostgreSQL" instala el
    # cliente igual: el job no depende del contenedor.
    container:
      image: postgres:17
    # IMPORTANTE: en jobs con `container`, GitHub usa `sh` (dash) por defecto.
    # dash no entiende `set -o pipefail`, `shopt` ni arrays → de ahí venían los
    # "command not found" / exit 127. Forzamos bash en todos los pasos.
    defaults:
      run:
        shell: bash

    steps:
      - name: Comprobar secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta BACKUP_PASSPHRASE. El repo es público: los dumps NO se suben sin cifrar."
            exit 1
          fi
          # La URL lleva la contraseña: se enmascara para que nunca aparezca en el log.
          echo "::add-mask::$DATABASE_URL"

      # ── Cliente PostgreSQL: se asegura ANTES de cualquier uso ──────────
      # Busca pg_dump/psql en el PATH y también en las rutas típicas de las
      # imágenes postgres:*; si no están, los instala (con sudo si hace falta).
      # Deja las rutas absolutas en PG_BIN y PSQL_BIN para los pasos siguientes.
      - name: Asegurar cliente PostgreSQL (pg_dump y psql)
        run: |
          set -euo pipefail

          como_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo "$@"; fi
          }

          ubicar() {
            local nombre="$1" candidato
            if command -v "$nombre" >/dev/null 2>&1; then
              command -v "$nombre"
              return 0
            fi
            for candidato in /usr/lib/postgresql/*/bin/"$nombre" /usr/pgsql-*/bin/"$nombre"; do
              if [ -x "$candidato" ]; then
                echo "$candidato"
                return 0
              fi
            done
            return 1
          }

          if ubicar pg_dump >/dev/null 2>&1 && ubicar psql >/dev/null 2>&1; then
            echo "Cliente PostgreSQL ya disponible en la imagen."
          else
            echo "Cliente PostgreSQL ausente: instalando postgresql-client..."
            como_root apt-get update || true
            # Sin `set -e` abortando acá: si apt falla, queremos llegar a la
            # verificación de abajo y dar un mensaje entendible (no un 100 seco).
            if ! como_root apt-get install -y --no-install-recommends postgresql-client; then
              echo "::warning::postgresql-client falló; probando los nombres alternativos del paquete..."
              como_root apt-get install -y --no-install-recommends \
                postgresql-client-common postgresql-client || true
            fi
          fi

          BIN_PGDUMP="$(ubicar pg_dump || true)"
          BIN_PSQL="$(ubicar psql || true)"
          if [ -z "$BIN_PGDUMP" ] || [ -z "$BIN_PSQL" ]; then
            echo "::error::No se pudo instalar el cliente de PostgreSQL (pg_dump/psql). Revisá la imagen del job o instalá postgresql-client."
            exit 1
          fi

          {
            echo "PG_BIN=$BIN_PGDUMP"
            echo "PSQL_BIN=$BIN_PSQL"
          } >> "$GITHUB_ENV"

          "$BIN_PGDUMP" --version
          "$BIN_PSQL" --version

      # ── Preflight: puerto (Session Pooler) y compatibilidad de versiones ──
      # Valida antes de intentar el dump, para que un fallo diga exactamente qué
      # corregir en lugar de terminar en un "version mismatch" críptico.
      - name: Validar conexión, puerto y versiones
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          PGDUMP="${PG_BIN:-pg_dump}"
          PSQL="${PSQL_BIN:-psql}"

          # ── Puerto: pg_dump NO funciona contra el Transaction Pooler (6543) ──
          resto="${DATABASE_URL##*@}"          # host:puerto/db  (##*@ = último @)
          host_puerto="${resto%%/*}"
          host="${host_puerto%%:*}"
          puerto="${host_puerto##*:}"
          if [ "$puerto" = "$host_puerto" ]; then puerto="5432"; fi

          echo "Host: ${host}"
          echo "Puerto: ${puerto}"

          if [ "$puerto" = "6543" ]; then
            echo "::error::DATABASE_URL apunta al puerto 6543 (Transaction Pooler). pg_dump necesita el Session Pooler: usá el puerto 5432."
            exit 1
          fi
          if [ "$puerto" != "5432" ]; then
            echo "::warning::El puerto es ${puerto}; para Session Pooler de Supabase se espera 5432."
          fi

          # ── Conexión: si esto falla, el resto del job no tiene sentido ──
          if ! servidor_version="$("$PSQL" "$DATABASE_URL" -tAc 'show server_version' | tr -d '[:space:]')"; then
            echo "::error::No se pudo conectar con DATABASE_URL (psql falló). Revisá la contraseña de backup_reader, el SSL y el host del Session Pooler."
            exit 1
          fi
          if [ -z "$servidor_version" ]; then
            echo "::error::La conexión respondió vacío al pedir server_version."
            exit 1
          fi

          # ── Permisos: el dump necesita leer todas las tablas ──
          if ! "$PSQL" "$DATABASE_URL" -tAc "select 1 from public.miembros_salon limit 1" >/dev/null 2>&1; then
            echo "::warning::No se pudo leer public.miembros_salon: verificá que backup_reader tenga pg_read_all_data."
          fi

          # ── Versiones: cliente (pg_dump) vs servidor ──
          version_cliente="$("$PGDUMP" --version 2>/dev/null || echo 'cliente no encontrado')"
          echo "Cliente: ${version_cliente}"
          echo "Servidor: ${servidor_version}"

          cliente_major="$(printf '%s' "$version_cliente" | sed -n 's/.*) \([0-9][0-9]*\).*/\1/p')"
          servidor_major="$(printf '%s' "$servidor_version" | sed -n 's/^\([0-9][0-9]*\).*/\1/p')"
          echo "Major cliente=${cliente_major:-?} · major servidor=${servidor_major:-?}"

          if [ -n "$servidor_major" ]; then
            echo "PG_MAJOR_SERVIDOR=${servidor_major}" >> "$GITHUB_ENV"
          fi
          echo "PG_CLIENTE_MAJOR=${cliente_major}" >> "$GITHUB_ENV"

          # pg_dump aborta si el cliente es más viejo que el servidor (nunca al revés).
          if [ -n "$cliente_major" ] && [ -n "$servidor_major" ] && [ "$cliente_major" -lt "$servidor_major" ]; then
            echo "::warning::El cliente (${cliente_major}) es más viejo que el servidor (${servidor_major}); se instalará el cliente ${servidor_major}."
          fi

      # ── Solo si hay mismatch real: instalar el major exacto ──────────────
      # El paquete postgresql-client-<major> lo publica postgresql.org (PGDG);
      # en Ubuntu/Debian base puede no existir, así que se agrega el repo.
      - name: Ajustar cliente al major del servidor
        if: "env.PG_MAJOR_SERVIDOR != '' && env.PG_MAJOR_SERVIDOR != env.PG_CLIENTE_MAJOR"
        run: |
          set -euo pipefail
          major="$PG_MAJOR_SERVIDOR"

          como_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo "$@"; fi
          }

          echo "Instalando postgresql-client-${major}..."
          como_root apt-get update || true

          if ! como_root apt-get install -y --no-install-recommends "postgresql-client-${major}"; then
            echo "No está en los repos base: agregando el repositorio de postgresql.org (PGDG)..."
            como_root apt-get install -y --no-install-recommends postgresql-common || true
            if [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
              como_root /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y || true
            fi
            como_root apt-get update
            if ! como_root apt-get install -y --no-install-recommends "postgresql-client-${major}"; then
              echo "::error::No se pudo instalar postgresql-client-${major}. Ajustá la imagen del job (container: postgres:${major}) y volvé a correr."
              exit 1
            fi
          fi

          candidato="/usr/lib/postgresql/${major}/bin/pg_dump"
          if [ -x "$candidato" ]; then
            echo "PG_BIN=${candidato}" >> "$GITHUB_ENV"
            "$candidato" --version
          else
            echo "::error::Se instaló el cliente ${major} pero no se encontró ${candidato}."
            exit 1
          fi

      - name: Instalar gpg
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update && apt-get install -y --no-install-recommends gnupg
            else
              sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg
            fi
          fi

      - name: Generar respaldos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          BIN="${PG_BIN:-pg_dump}"          # ruta absoluta resuelta en el bootstrap
          mkdir -p "$GITHUB_WORKSPACE/backup"
          FECHA="$(date -u +%Y-%m-%d)"
          "$BIN" "$DATABASE_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain \
            | gzip -9 > "$GITHUB_WORKSPACE/backup/public_${FECHA}.sql.gz"
          "$BIN" "$DATABASE_URL" \
            --schema=auth \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain \
            | gzip -9 > "$GITHUB_WORKSPACE/backup/auth_${FECHA}.sql.gz"
          echo "FECHA=${FECHA}" >> "$GITHUB_ENV"

      # ── Validación del archivo ───────────────────────────────────────────
      # Un dump "exitoso" pero vacío es peor que un fallo: se subiría un
      # artifact inútil y nadie se enteraría hasta necesitarlo.
      - name: Validar que los dumps no estén vacíos
        run: |
          set -euo pipefail
          shopt -s nullglob
          archivos=("$GITHUB_WORKSPACE"/backup/*.sql.gz)
          if [ ${#archivos[@]} -eq 0 ]; then
            echo "::error::No se generó ningún archivo de backup."
            exit 1
          fi
          for archivo in "${archivos[@]}"; do
            nombre="$(basename "$archivo")"
            bytes="$(stat -c%s "$archivo")"
            # 1) Tamaño: un archivo de 0 bytes es el caso más común de dump fallido.
            if [ "$bytes" -eq 0 ]; then
              echo "::error::${nombre} pesa 0 bytes: el dump salió vacío. Revisá DATABASE_URL y los permisos de backup_reader."
              exit 1
            fi
            # 2) Integridad: si el gzip está roto, cualquier lectura posterior
            #    aborta el paso por pipefail y se pierde el mensaje.
            if ! gzip -t "$archivo" 2>/dev/null; then
              echo "::error::${nombre} está corrupto (gzip -t falló): el dump se cortó a mitad de camino."
              exit 1
            fi
            lineas="$(gzip -dc "$archivo" 2>/dev/null | wc -l | tr -d '[:space:]')"
            echo "${nombre}: ${bytes} bytes comprimidos, ${lineas} líneas"
            if [ "$lineas" -lt 20 ]; then
              echo "::error::${nombre} tiene ${lineas} líneas: no parece un dump válido de pg_dump."
              exit 1
            fi
            if [ "$bytes" -lt 512 ]; then
              echo "::error::${nombre} pesa solo ${bytes} bytes comprimidos: sospechosamente chico para un schema completo."
              exit 1
            fi
          done

      - name: Cifrar dumps
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          for archivo in "$GITHUB_WORKSPACE"/backup/*.sql.gz; do
            gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
                --symmetric --cipher-algo AES256 "$archivo"
            rm -f "$archivo"
          done

      - name: Verificar dumps cifrados
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          ls -lh "$GITHUB_WORKSPACE/backup"
          for archivo in "$GITHUB_WORKSPACE"/backup/*.sql.gz.gpg; do
            gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
                --decrypt "$archivo" | gzip -t
          done

      - name: Subir artifact cifrado
        uses: actions/upload-artifact@v4
        with:
          name: eli-backup-${{ env.FECHA }}
          path: ${{ github.workspace }}/backup/*.gpg
          retention-days: 90
          if-no-files-found: error

  storage:
    name: Storage logos (S3 opcional)
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar credenciales S3
        id: check
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$S3_ACCESS_KEY_ID" ] || [ -z "$S3_SECRET_ACCESS_KEY" ] \
             || [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ]; then
            echo "::warning::Storage omitido: faltan secrets S3_* (Dashboard Supabase > Storage > S3 access keys)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar bucket
        if: steps.check.outputs.ready == 'true'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages --quiet awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${S3_REGION:-us-east-1}"
          mkdir -p storage
          aws s3 sync "s3://${S3_BUCKET}" "storage/${S3_BUCKET}" \
            --endpoint-url "$S3_ENDPOINT" --only-show-errors
          tar -czf "storage/storage_$(date -u +%Y-%m-%d).tar.gz" -C storage "${S3_BUCKET}"

      - name: Subir artifact de Storage
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eli-storage-${{ github.run_id }}
          path: storage/*.tar.gz
          retention-days: 30
          if-no-files-found: warn
